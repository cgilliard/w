[package]
name = "tabnode"
version = "0.1.0"
edition = "2024"

[features]
# The dev networks (`--network dev`, `dev-recursive`): their built-in
# dataset and plan. Off by default, so release builds carry none of it.
dev = []

# No dependencies from outside this repository: the standard library,
# and what the four programs share.
[dependencies]
tabshared = { path = "../shared" }

[profile.release]
codegen-units = 1
lto = true
