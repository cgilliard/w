[package]
name = "tabshared"
version = "0.1.0"
edition = "2024"

[features]
# The dev networks (`--network dev`, `dev-recursive`): their built-in
# dataset and plan. Off by default, so release builds carry none of it.
dev = []
# What tests share (a generator of test values, a file in memory that
# can lose power): for the tests of the programs built on this.
testing = []

# No dependencies: the standard library and nothing else.
[dependencies]
